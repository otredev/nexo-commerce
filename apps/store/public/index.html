<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda — Nexo</title>
  <style>
    :root { --bg: #fafaf9; --ink: #1c1c1a; --muted: #5f5e5a; --primary: #2f6b4f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121211; --ink: #ededea; --muted: #a8a7a1; --primary: #6fb08d; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/26px ui-sans-serif, system-ui, sans-serif; }
    h1 { font: 400 44px/48px ui-serif, Georgia, serif; margin: 0 0 8px; }
    p { margin: 0; color: var(--muted); }
    span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); margin-right: 12px; }
  </style>
</head>
<body>
  <main><h1><span></span>Próximamente</h1><p>La tienda online de este negocio estará disponible muy pronto.</p></main>
</body>
</html>
